name: ProofLedger CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: Backend CI (NestJS & Prisma)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proofledger_user
          POSTGRES_PASSWORD: proofledger_pass
          POSTGRES_DB: proofledger_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd apps/api
          npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Run Database Migrations
        env:
          DATABASE_URL: "postgresql://proofledger_user:proofledger_pass@localhost:5433/proofledger_db?schema=public"
        run: |
          cd apps/api
          npx prisma db push

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://proofledger_user:proofledger_pass@localhost:5433/proofledger_db?schema=public"
          JWT_SECRET: "ci_testing_secret_key"
        run: |
          cd apps/api
          npm test

      - name: Build NestJS Application
        run: |
          cd apps/api
          npm run build

  frontend-ci:
    name: Frontend CI (Next.js & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run Next.js Linter
        run: |
          cd apps/web
          npm run lint

      - name: Build Next.js Web Application
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3000"
        run: |
          cd apps/web
          npm run build
